<style>

<script>
        function updateScreen(projectId) {
            // Update Orbs
            document.querySelectorAll('.glass-orb').forEach(orb => {
                orb.classList.remove('active');
                orb.querySelector('span:first-child').classList.replace('text-primary', 'text-tertiary-container');
            });
            
            const activeOrb = document.querySelector(`.glass-orb[data-project="${projectId}"]`);
            if(activeOrb) {
                activeOrb.classList.add('active');
                activeOrb.querySelector('span:first-child').classList.replace('text-tertiary-container', 'text-primary');
            }

            // Update Screens
            document.querySelectorAll('.screen-content').forEach(screen => {
                screen.classList.add('opacity-0', 'pointer-events-none');
            });
            
            const activeScreen = document.getElementById(`screen-${projectId}`);
            if(activeScreen) {
                activeScreen.classList.remove('opacity-0', 'pointer-events-none');
            }
        }
    </script>
