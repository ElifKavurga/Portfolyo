<style>
        .orbit-float {

            animation: float 8s ease-in-out infinite 2s;
        }
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(2deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        
        .screen-transition {
            transition: opacity 0.4s ease-in-out, transform 0.4s cubic-bezier(0.2, 0, 0, 1);
        }
        .screen-out {
            opacity: 0;
            transform: scale(0.98);

<script>
        document.addEventListener('DOMContentLoaded', () => {
            const buttons = document.querySelectorAll('.project-btn');
            const screen = document.getElementById('monitor-screen');

            buttons.forEach(btn => {
                btn.addEventListener('click', function() {
                    // Reset styling on all buttons
                    buttons.forEach(b => {
                        b.classList.remove('border-primary', 'shadow-[0_0_20px_rgba(173,198,255,0.1)]');
                        b.classList.add('border-outline-variant', 'opacity-70');
                        const icon = b.querySelector('.material-symbols-outlined');
                        const text = b.querySelector('span:last-child');
                        if(!b.isSameNode(this)) {
                           // Reset icon/text color logic could go here if needed, but keeping it simple
                        }
                    });

                    // Add active styling to clicked
                    this.classList.remove('border-outline-variant', 'opacity-70');
                    this.classList.add('border-primary', 'shadow-[0_0_20px_rgba(173,198,255,0.1)]');
                    
                    const newImgUrl = this.getAttribute('data-project-img');
                    const newAltText = this.getAttribute('data-project-alt');

                    // Animate out
                    screen.classList.add('screen-out');
                    
                    setTimeout(() => {
                        // Swap content
                        screen.src = newImgUrl;
                        screen.setAttribute('data-alt', newAltText);
                        
                        // Wait a tiny bit for render, then animate in
                        requestAnimationFrame(() => {
                            screen.classList.remove('screen-out');
                        });
                    }, 400); // Matches CSS transition duration
                });
            });
        });
    </script>
