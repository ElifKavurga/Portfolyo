server:
  port: 8080

spring:
  application:
    name: portfolio-backend
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:portfolio}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:1234}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

github:
  token: ${GITHUB_TOKEN:}
  api-url: https://api.github.com

cache:
  github-projects-ttl-hours: 1

app:
  cors:
    allowed-origins:
      - http://localhost:5173

logging:
  level:
    com.portfolio: INFO
